  <g class="card"><rect x="384" y="38" width="132" height="58" rx="9" fill="#11161d" stroke="#c6e478" stroke-opacity=".65"/><text class="sans" x="450" y="63.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">반납</text><text class="mono" x="450" y="82.5" text-anchor="middle" font-size="11.5" fill="#c6e478">returnings</text></g>
  <g class="card"><rect x="564" y="38" width="132" height="58" rx="9" fill="#11161d" stroke="#c6e478" stroke-opacity=".65"/><text class="sans" x="630" y="63.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">불용</text><text class="mono" x="630" y="82.5" text-anchor="middle" font-size="11.5" fill="#c6e478">disuses</text></g>
  <g class="card"><rect x="744" y="38" width="132" height="58" rx="9" fill="#11161d" stroke="#c792ea" stroke-opacity=".65"/><text class="sans" x="810" y="63.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">처분</text><text class="mono" x="810" y="82.5" text-anchor="middle" font-size="11.5" fill="#c792ea">disposals</text></g>
  <g class="card"><rect x="56" y="196" width="170" height="68" rx="9" fill="#11161d" stroke="#6fb6d8" stroke-opacity=".65"/><text class="sans" x="141" y="218.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">WAIT</text><text class="sans" x="141" y="237.5" text-anchor="middle" font-size="12" fill="#6fb6d8">작성 중</text><text class="sans" x="141" y="253.5" text-anchor="middle" font-size="12" fill="#6fb6d8">수정 · 삭제 가능</text></g>
  <g class="card"><rect x="326" y="196" width="170" height="68" rx="9" fill="#11161d" stroke="#6fb6d8" stroke-opacity=".65"/><text class="sans" x="411" y="226.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">REQUEST</text><text class="sans" x="411" y="245.5" text-anchor="middle" font-size="12" fill="#6fb6d8">승인 요청 상태</text></g>
  <g class="card"><rect x="620" y="166" width="224" height="40" rx="9" fill="#11161d" stroke="#c792ea" stroke-opacity=".65"/><text class="sans" x="732" y="190.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">APPROVED · 승인 확정</text></g>
  <g class="card"><rect x="620" y="210" width="224" height="40" rx="9" fill="#11161d" stroke="#c792ea" stroke-opacity=".65"/><text class="sans" x="732" y="234.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">REJECTED · 반려</text></g>
