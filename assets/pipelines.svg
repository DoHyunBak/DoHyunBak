<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" role="img" aria-labelledby="t d">
  <title id="t">One Shape, Four Systems</title>
  <desc id="d">네 시스템의 공통 파이프라인. 입력, 경계, 핵심 처리, 출력, 실패 경로 순서. U-sto: 조달청 OpenAPI, 변환 · 중복 제거, Staging 병합, 자산 마스터, Sync History. W브릿지: AI 응답, 파싱 · 형식 점검, 호출 · 저장 분리, 리포트 · 추천, 빈 결과 허용. DOVIS: 방문자 질문, 입력 정제 · 제한, RAG 파이프라인, 3D 코어 응답, 키워드 지식 베이스. Kids Friends: 센서 허브, 이벤트 계약, Spring Boot 중계, 로봇 앱 방송, Arduino 백업 허브.</desc>
  <style>
    .sans { font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { stroke-dasharray: 7 93; animation: flow 3.2s linear infinite; }
    .ants { stroke-dasharray: 4 5; animation: ants 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes ants { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .ants { animation: none; } .pulse { display: none; } }
  </style>
