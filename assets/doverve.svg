<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 118" role="img" aria-labelledby="t d">
  <title id="t">DOVERVE 구조</title>
  <desc id="d">React, TypeScript, Vite 화면이 기능별로 화면, 업무 로직, 외부 연동을 나누고 Spring Boot API를 거쳐 MariaDB에 연결됩니다.</desc>
  <style>
    .sans { font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { stroke-dasharray: 7 93; animation: flow 3.2s linear infinite; }
    .ants { stroke-dasharray: 4 5; animation: ants 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes ants { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .ants { animation: none; } .pulse { display: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="af" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ff7b72" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="899" height="117" rx="14" fill="#0a0d12" stroke="#262d36"/>
  <path d="M210 59 L246 59" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M210 59 L246 59" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-0.00s"/>
  <path d="M432 59 L468 59" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M432 59 L468 59" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-0.53s"/>
  <path d="M654 59 L690 59" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M654 59 L690 59" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-1.06s"/>
  <g class="card"><rect x="24" y="26" width="186" height="66" rx="9" fill="#11161d" stroke="#ecc48d" stroke-opacity=".65"/><text class="sans" x="117" y="55.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">React · TypeScript</text><text class="mono" x="117" y="74.5" text-anchor="middle" font-size="11.5" fill="#ecc48d">Vite · React Router</text></g>
  <g class="card"><rect x="246" y="26" width="186" height="66" rx="9" fill="#11161d" stroke="#6fb6d8" stroke-opacity=".65"/><text class="sans" x="339" y="55.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">기능별 분리</text><text class="sans" x="339" y="74.5" text-anchor="middle" font-size="12" fill="#6fb6d8">화면 · 업무 로직 · 외부 연동</text></g>
  <g class="card"><rect x="468" y="26" width="186" height="66" rx="9" fill="#11161d" stroke="#c6e478" stroke-opacity=".65"/><text class="sans" x="561" y="55.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Spring Boot API</text><text class="sans" x="561" y="74.5" text-anchor="middle" font-size="12" fill="#c6e478">작품 · 회차 · 서재 · 커뮤니티</text></g>
  <g class="card"><rect x="690" y="26" width="186" height="66" rx="9" fill="#11161d" stroke="#c792ea" stroke-opacity=".65"/><text class="sans" x="783" y="55.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">MariaDB</text><text class="sans" x="783" y="74.5" text-anchor="middle" font-size="12" fill="#c792ea">콘텐츠 · 회원 데이터</text></g>
