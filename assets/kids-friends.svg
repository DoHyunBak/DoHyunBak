<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" role="img" aria-labelledby="t d">
  <title id="t">Kids Friends 시스템</title>
  <desc id="d">라즈베리파이 센서 허브 KF-HW와 아두이노 백업 KF_AD가 POST /api/sensor-events로 센서값을 보냅니다. Spring Boot 서버 KF-BE가 WebSocket /ws/sensors로 Temi 앱 KF-FE에 방송하고, 앱의 AI 질문을 REST로 받아 Groq LLM으로 답합니다. 관리자 웹 KF_WEB은 REST로 연결됩니다.</desc>
  <style>
    .sans { font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { stroke-dasharray: 7 93; animation: flow 3.2s linear infinite; }
    .ants { stroke-dasharray: 4 5; animation: ants 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes ants { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .ants { animation: none; } .pulse { display: none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="af" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ff7b72" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="899" height="351" rx="14" fill="#0a0d12" stroke="#262d36"/>
  <rect x="20" y="16" width="204" height="248" rx="12" fill="none" stroke="#2a323c" stroke-dasharray="3 4"/>
  <text class="sans" x="34" y="36" font-size="11.5" font-weight="600" letter-spacing=".4" fill="#8b949e">센서 허브</text>
  <path d="M210 86 L372 86" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M210 86 L372 86" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-0.00s"/>
  <path class="ants" d="M210 206 L372 206" fill="none" stroke="#ff7b72" stroke-opacity=".85" marker-end="url(#af)"/>
  <path d="M548 70 L700 70" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M548 70 L700 70" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-0.53s"/>
  <path d="M700 102 L548 102" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M700 102 L548 102" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-1.06s"/>
  <path d="M700 206 L548 206" fill="none" stroke="#4a5561" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="pulse" pathLength="100" d="M700 206 L548 206" fill="none" stroke="#c6e478" stroke-width="2" stroke-linecap="round" style="animation-delay:-1.59s"/>
