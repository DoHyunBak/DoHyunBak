  <g class="card"><rect x="34" y="44" width="176" height="84" rx="9" fill="#11161d" stroke="#ecc48d" stroke-opacity=".65"/><text class="sans" x="122" y="74.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">KF-HW</text><text class="mono" x="122" y="93.5" text-anchor="middle" font-size="11.5" fill="#ecc48d">Raspberry Pi</text><text class="sans" x="122" y="109.5" text-anchor="middle" font-size="11.5" fill="#ecc48d">미세먼지 · 화재 · 거리 · 비전</text></g>
  <g class="card"><rect x="34" y="164" width="176" height="84" rx="9" fill="#11161d" stroke="#ff7b72" stroke-opacity=".65" stroke-dasharray="5 4"/><text class="sans" x="122" y="194.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">KF_AD</text><text class="mono" x="122" y="213.5" text-anchor="middle" font-size="11.5" fill="#ff7b72">Arduino Mega</text><text class="sans" x="122" y="229.5" text-anchor="middle" font-size="12" fill="#ff7b72">Pi 고장 시 대체</text></g>
  <g class="card"><rect x="372" y="44" width="176" height="204" rx="9" fill="#11161d" stroke="#c6e478" stroke-opacity=".65"/><text class="sans" x="460" y="118.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">KF-BE</text><text class="mono" x="460" y="137.5" text-anchor="middle" font-size="11.5" fill="#c6e478">Spring Boot 3.5</text><text class="mono" x="460" y="153.5" text-anchor="middle" font-size="11.5" fill="#c6e478">Spring AI</text><text class="sans" x="460" y="169.5" text-anchor="middle" font-size="12" fill="#c6e478">센서 수신 · 중계</text><text class="sans" x="460" y="185.5" text-anchor="middle" font-size="12" fill="#c6e478">AI 대화 생성</text></g>
  <g class="card"><rect x="700" y="44" width="176" height="84" rx="9" fill="#11161d" stroke="#c792ea" stroke-opacity=".65"/><text class="sans" x="788" y="74.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">KF-FE</text><text class="sans" x="788" y="93.5" text-anchor="middle" font-size="12" fill="#c792ea">Temi Android 앱</text><text class="sans" x="788" y="109.5" text-anchor="middle" font-size="12" fill="#c792ea">표정 · 음성 · 화면</text></g>
  <g class="card"><rect x="700" y="164" width="176" height="84" rx="9" fill="#11161d" stroke="#c792ea" stroke-opacity=".65"/><text class="sans" x="788" y="194.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">KF_WEB</text><text class="sans" x="788" y="213.5" text-anchor="middle" font-size="12" fill="#c792ea">관리자 웹 데모</text><text class="mono" x="788" y="229.5" text-anchor="middle" font-size="11.5" fill="#c792ea">React · Vite</text></g>
  <g class="card"><rect x="372" y="280" width="176" height="54" rx="9" fill="#11161d" stroke="#ecc48d" stroke-opacity=".65"/><text class="sans" x="460" y="303.5" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Groq LLM</text><text class="sans" x="460" y="322.5" text-anchor="middle" font-size="12" fill="#ecc48d">대화 생성</text></g>
  <rect x="213.6" y="65" width="154.9" height="16" rx="3" fill="#0a0d12"/>
  <text class="mono" x="291" y="77" text-anchor="middle" font-size="10.5" fill="#aab4bf">POST /api/sensor-events</text>
  <rect x="239.6" y="185" width="102.8" height="16" rx="3" fill="#0a0d12"/>
  <text class="sans" x="291" y="197" text-anchor="middle" font-size="11" fill="#ff9b94">같은 규격으로 대체</text>
  <rect x="552.9" y="49" width="142.3" height="16" rx="3" fill="#0a0d12"/>
  <text class="mono" x="624" y="61" text-anchor="middle" font-size="10.5" fill="#aab4bf">WebSocket /ws/sensors</text>
  <rect x="580.9" y="105" width="86.1" height="16" rx="3" fill="#0a0d12"/>
  <text class="sans" x="624" y="117" text-anchor="middle" font-size="11" fill="#aab4bf">AI 질문 · REST</text>
  <rect x="606.4" y="185" width="35.2" height="16" rx="3" fill="#0a0d12"/>
  <text class="mono" x="624" y="197" text-anchor="middle" font-size="10.5" fill="#aab4bf">REST</text>
</svg>
