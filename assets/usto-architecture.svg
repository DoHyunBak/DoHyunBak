  <desc id="d">요청은 Spring Security를 거쳐 presentation, application, domain으로 흐릅니다. infrastructure가 domain의 Repository 포트를 구현하고 MySQL에 접근합니다. application은 외부 API와 AI 서버를 호출합니다. 도메인 11개가 같은 구조입니다.</desc>
